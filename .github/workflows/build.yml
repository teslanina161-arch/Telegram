name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant gradlew
        run: chmod +x TMessagesProj/gradlew

      - name: Build
        run: cd TMessagesProj && ./gradlew assembleTMessageRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: warn
